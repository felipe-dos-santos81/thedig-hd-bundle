room_011:
  kind: scene
  style: painted
  caption: >-
    SCENE: An alien sand canyon under a huge overhanging wall of carved stone blocks. Below the wall, pale sand dunes lead down to a wide floor of rippled sand with standing rocks. A small arched opening at the base of the wall glows green. The atmosphere is warm, dusty and enclosed.


    MEDIUM: Painted: hand-painted art, with dithering for the gradients in the shadows and the sand ripples, and soft airbrushed transitions on the lit stone.


    VIEW: Eye-level perspective looking slightly upward into the depth of the room. The framing captures a wide view of the space, anchored by foreground rocks at the bottom.


    LAYOUT:

    - Foreground (0.23–0.55 width, 0.65–1.0 height): A large cracked, light-tan boulder rises from the bottom edge; a smaller rock sits at the left (0.0–0.18 width, 0.55–0.7 height).

    - Middle Ground (0.0–1.0 width, 0.47–1.0 height): A broad floor of rippled sand, banded in orange and purple, stretches across the canyon; two standing rocks rise on the right (0.77–0.93 width, 0.45–0.7 height).

    - Background (0.0–1.0 width, 0.0–0.47 height): A huge overhanging wall of carved rectangular stone blocks fills the top, with a dark recess at the upper right (0.73–0.85 width, 0.15–0.35 height); pale sand dunes slope up against its base.

    - Center Detail (0.44–0.52 width, 0.38–0.48 height): A small arched opening at the base of the wall holds a cluster of glowing green lights.


    OBJECTS:

    - Stone Walls: Composed of large, irregular masonry blocks covering the upper half of the scene.

    - Floor: Rippled sand in horizontal bands, orange on the crests and purple in the troughs.

    - Green Lights: About ten bright green lights in a loose circle inside the arched opening at the centre of the wall's base.

    - Rocks: A large cracked light-tan boulder in the foreground, a smaller rock at the left, two standing rocks on the right.

    - No doors, furniture, or machines are visible.


    LIGHTING: Strong, warm directional light enters from the top left, casting long, soft highlights along the upper left wall and the tops of the foreground rocks. The right side of the room and the deep recesses of the floor fall into heavy, cool-toned shadow (purple/blue).


    PALETTE: Dominated by warm oranges, ochres, and rust browns on the lit surfaces. Shadows are rendered in deep purples, indigos, and blacks. The only non-earth-tone color is the neon green of the central lights.


    TEXT: None.


    INVARIANTS: The overhanging wall fills the top and meets the dunes at mid-height. The arched opening with the green lights stays at the centre of the wall's base. The foreground rocks must maintain their specific placement to frame the bottom edge without blocking the view of the middle ground.
