room_002:
  kind: scene
  style: rendered
  caption: >-
    SCENE: Exterior space view. A white space shuttle, seen from above and behind with its payload bay doors open, occupies the left third; a dark, irregular, cratered asteroid sits whole in the right quarter. Deep black void with sparse stars and faint nebulous blue patches fills the rest.


    MEDIUM: Pre-rendered 3D with painted/airbrushed textures. Evidence: hard CGI shading on hull panels, airbrushed radial glow around the star, painterly mottled surface on the moon.


    VIEW: Wide landscape framing. Slight low-angle perspective looking up at the ship's upper deck; flat orthographic-style distance for the celestial bodies.


    LAYOUT:

    - Shuttle (foreground/midground): x0–0.37, y0–1. Tail fin at the top left (x0.1, y0–0.22); the fuselage runs from there down to the nose and cockpit windows at the bottom (x0.15–0.31, y0.66–1). Both payload bay doors stand open: ribbed panels to the left (x0–0.12) and right (x0.22–0.37) of the open bay, whose cargo is visible inside.

    - Star (background): x0.45–0.6, y0.1–0.35. Bright yellow core with diffuse orange halo.

    - Asteroid (background): x0.73–0.96, y0.05–0.95. Irregular, heavily cratered rock, fully inside the frame, mostly in shadow.

    - Stars (background): scattered points across full frame.


    OBJECTS:

    - Shuttle: payload bay doors open (the two ribbed panels either side of the fuselage are the doors), cargo visible in the bay, cockpit windows at the nose, tail fin at the top left, small red markings on the hull.

    - Asteroid: no visible structures or openings.

    - No doors, machines, crystals, plates, or furniture other than the ship itself.


    LIGHTING: Primary source is the star (upper center). It casts strong highlights on the top surfaces of the ship’s hull and creates deep shadows on its underside and rear. The asteroid is backlit; only its left rim catches light, leaving the face in darkness. Overall exposure is high-contrast; most of the frame is near-black.


    PALETTE:

    - Ship: bright white/light grey with cool blue-grey shadows.

    - Star: intense yellow-white core fading to amber/orange.

    - Asteroid: desaturated blue-grey, almost black in shadow areas.

    - Background: pure black with tiny white/blue star pixels.


    TEXT: none


    INVARIANTS:

    - The shuttle stays anchored to the left edge, tail at the top left and nose pointing down to the bottom edge.

    - Star must sit in upper-center, unobstructed.

    - The asteroid stays whole inside the frame at the right (x0.73–0.96), not cropped.

    - The gap between the shuttle and the asteroid must remain empty black space.

    - Relative scale: the shuttle appears closer and larger than the asteroid.

    - No people are present in the background.
