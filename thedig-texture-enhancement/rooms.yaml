room_004:
  kind: scene
  style: painted
  caption: >-
    SCENE: Exterior space view. A massive, pockmarked celestial body dominates the right two-thirds of the frame against a starfield.


    MEDIUM: Painted: a soft, airbrushed digital painting with smooth gradients and diffuse shading on the asteroid surface; pixel stars in the background.


    VIEW: Close-up view. The camera is positioned near the limb of the object, looking across its curved surface from left to right.


    LAYOUT:

    *   **Celestial Body:** Occupies roughly x=0.25 to x=1.0 (right 75% of width) and y=0 to y=1.0 (full height). It curves from the top-left down to the bottom-right.

    *   **Starfield:** Fills the negative space on the left, x=0 to x=0.45.

    *   **Surface Features:** Large, deep craters are visible. One prominent dark circular crater is centered at approximately x=0.8, y=0.75. Another large depression is at x=0.6, y=0.4. Smaller impact marks cover the rest of the surface.


    OBJECTS: No doors, machines, or furniture. The scene consists solely of the rocky/icy planetary surface and distant stars. No people.


    LIGHTING: Low-key lighting. The light source appears to be off-screen to the left, illuminating the left-facing slopes of the craters and the main limb of the planet. The right side of the object falls into deep shadow. Shadows within the craters are dark but not pure black, retaining some purple hue.


    PALETTE:

    *   **Space:** Black (#000000) with white, grey, and faint yellow/orange pixel stars.

    *   **Planet Surface:** Muted purples, lavenders, and dusty mauves. Highlights are pale periwinkle; shadows are deep violet-black.


    TEXT: None.


    INVARIANTS:

    *   The diagonal curve of the planet's limb separating the starfield from the surface.

    *   The specific placement and depth of the large crater at the lower right.

    *   The contrast between the illuminated left edge of the planet and the shadowed right interior.

    *   The sparse distribution of stars in the upper-left quadrant.
