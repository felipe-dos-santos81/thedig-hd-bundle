room_060:
  kind: scene
  style: painted
  caption: >-
    SCENE: Interior of a stone structure, likely a ruin or temple. The architecture is defined by massive, angular rock and carved blocks. The atmosphere is enclosed and ancient.


    MEDIUM: Painted. Evidence includes visible brushstrokes in the rock textures, airbrushed gradients on the curved surfaces, and distinct dithering patterns characteristic of 256-colour digital painting.


    VIEW: Eye-level, slightly low angle looking up towards an opening in the upper right. The framing is tight, focusing on the immediate structural elements.


    LAYOUT:

    *   **Background (Upper Right):** A bright, irregular blue-lit opening with a blue crystalline structure inside occupies the top right corner (x: 0.78-1.0, y: 0.0-0.35).

    *   **Middle Ground (Center/Left):** A large, pale yellow stone pillar or archway dominates the center (x: 0.3-0.7, y: 0.0-0.8), angling down towards the left. Behind it to the left, tiled stone floor slabs recede in perspective into a dark area (x: 0.0-0.4, y: 0.2-0.8).

    *   **Foreground (Bottom):** Rough, uneven rocky ground spans the bottom edge (y: 0.7-1.0). A cluster of dark, indistinct debris or rubble sits centrally at the base of the pillar (x: 0.4-0.7, y: 0.7-1.0). A large rounded tan rock fills the lower right corner (x: 0.68-1.0, y: 0.65-1.0).


    OBJECTS:

    *   **Pillar/Arch:** A large, smooth-faced stone structure with beveled edges, running diagonally from top-center to mid-left.

    *   **Opening:** An irregular aperture in the upper right, with a blue crystalline structure inside it.

    *   **Floor Slabs:** Tiled stone slabs in perspective in the shadowed area on the left.

    *   **Rounded Rock:** A large rounded tan rock in the lower right corner.

    *   **Debris:** A pile of dark, textured material at the foot of the central pillar.

    *   **Doors:** None visible.


    LIGHTING: Primary light source is from the upper right opening, casting a cool blue-white glow. Secondary warm light illuminates the face of the central pillar from the front-right, creating strong contrast with the deep shadows on the left and under the arch.


    PALETTE: Dominant ochre, tan, and pale yellow for the stone. Deep browns and blacks for shadows. Cool cyan and white for the light source in the upper right.


    TEXT: None.


    INVARIANTS: The diagonal sweep of the central pillar from top-center to lower-left. The high-contrast lighting split between the warm interior stone and the cool light from the upper-right opening. The tiled floor slabs on the left and the rounded rock in the lower right corner. The rough texture of the foreground floor contrasting with the smoother pillar faces. No people.
