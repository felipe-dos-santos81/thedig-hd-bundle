room_027:
  kind: scene
  style: rendered
  caption: >-
    SCENE: A vertical, symmetrical alien interior or cavern shaft. The architecture is non-rectilinear, composed of angular rock formations and crystalline structures. The atmosphere is dark, mystical, and high-contrast.


    MEDIUM: Pre-rendered 3D with painterly textures. Evidence includes hard-edged polygonal geometry on the crystals, airbrushed gradients in the light beams, and flat-shaded surfaces typical of low-poly CGI.


    VIEW: A frontal, symmetrical perspective looking slightly upward into a deep chasm or chamber. The framing is a tall portrait orientation, emphasizing verticality.


    LAYOUT:

    *   **Background (Top):** An orange-glowing cavern ceiling or upper chamber (0-0.2 height) centered at x=0.5.

    *   **Middle Ground:** A large, inverted cone or funnel-shaped crystal structure dominates the center (x=0.5), spanning from y=0.2 to y=0.6. It rests on a wide, horizontal stone platform or shelf that crosses the width at y=0.25.

    *   **Foreground/Bottom:** Below the central cone, a diamond-shaped opening reveals a blue energy field (y=0.6-0.8). At the very bottom (y=0.8-1.0), a bright blue starburst light source sits within a geometric frame.

    *   **Sides:** Dark, angular rock pillars flank the left (x=0-0.2) and right (x=0.8-1) edges, creating a tunnel effect.


    OBJECTS:

    *   **Central Cone:** A large, translucent purple/blue crystal formation pointing downward, filled with vertical black streaks.

    *   **Platform:** A rough-hewn, reddish-orange stone shelf supporting the top of the central cone. Two small dark rocks sit on its left side (x=0.2, y=0.25).

    *   **Energy Field:** A horizontal band of crackling blue electricity or liquid light surrounding the base of the central cone.

    *   **Light Source:** A brilliant white-blue starburst at the bottom center (x=0.5, y=0.9), emitting radial beams.

    *   **Diamond Frame:** A dark, four-sided geometric border separating the middle energy field from the bottom light source.


    LIGHTING: Dual-source lighting. A warm orange glow emanates from the top, illuminating the underside of the upper ceiling and the top of the central platform. A cool, intense blue light emanates from the bottom, backlighting the central cone and illuminating the lower rock faces. Shadows are deep and saturated in the corners.


    PALETTE: High contrast complementary colors. Top half: Deep purples, blacks, and glowing oranges/reds. Bottom half: Deep blues, cyans, and electric whites.


    TEXT: None.


    INVARIANTS: The strict bilateral symmetry of the composition. The alignment of the central axis (top glow, central cone, diamond, bottom star). The distinct separation between the warm upper zone and cool lower zone. No people.
