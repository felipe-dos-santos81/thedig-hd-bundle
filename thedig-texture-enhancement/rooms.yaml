room_043:
  kind: scene
  style: painted
  caption: >-
    SCENE: Exterior canyon ledges. Sunlit orange rock ledges and a dark, speckled crevice fill the left and centre; across a chasm on the right, towering pale blue cliffs fall away.


    MEDIUM: Painted. Visible evidence includes soft airbrushing on the orange rock textures, dithering patterns in the dark central recess, and visible brushstrokes defining the striations in the background cliffs.


    VIEW: High-angle perspective looking down across the rock ledges toward the cliffs on the far side of the chasm. The framing is tight on the foreground rocks, which dominate the left and bottom of the frame.


    LAYOUT:

    *   **Foreground/Middle Ground (Left & Bottom):** Large, jagged rock masses occupy the left half (0 to 0.5) and bottom edge (0.7 to 1.0). These are rendered in warm oranges and browns.

    *   **Middle Ground (Center):** A dark, recessed crevice with speckled, star-like highlights runs diagonally from (0.3, 0.25) down to (0.55, 0.8). To its lower right the rocks fall into purple shadow (0.55 to 0.95 horizontally, 0.55 to 1.0 vertically).

    *   **Background (Right):** Pale blue cliffs across the chasm occupy the top right (0.55 to 1.0 horizontally, 0 to 0.6 vertically) and continue down the right edge to the bottom (0.9 to 1.0 horizontally, 0.4 to 1.0 vertically).


    OBJECTS:

    *   **Rock Formations:** Massive, irregular stone structures form the walls and floor. No doors, furniture, machines, or distinct props are present.

    *   **Chasm:** The gap between the ledges and the cliffs on the right.


    LIGHTING: Strong directional light enters from the upper right, illuminating the tops of the foreground rocks in bright orange and yellow. The interior recesses and the underside of the overhangs remain in deep shadow. The background cliffs are lit by ambient daylight, appearing cool and desaturated compared to the foreground.


    PALETTE:

    *   **Foreground Rocks:** High-saturation oranges, burnt siennas, and dark browns.

    *   **Shadows/Recesses:** Deep purples, near-black blues, and speckled white/yellow points.

    *   **Background:** Cool periwinkle blues, lavenders, and pale greys for the distant cliffs and sky.


    TEXT: None.


    INVARIANTS:

    *   The diagonal division between the warm, close-up rocks (bottom-left to top-center) and the cool, distant background (top-right).

    *   The specific shape of the rock overhang creating the "frame" for the background view.

    *   The contrast in temperature: intense warmth in the foreground versus cold tones in the distance.

    *   No people are painted into the background.
